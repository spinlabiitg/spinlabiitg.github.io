# Research
research_intro: {en: "Our overarching goal is to broaden the understanding of sensory interactions from a science and engineering perspective, by analyzing the associated signals. We use critical thinking, systematic experimentation, and in-depth analysis to address the questions we find most interesting. Here are the themes we currently work on.", hi: "हमारा व्यापक लक्ष्य संवेदी अंतःक्रियाओं से जुड़े संकेतों का विश्लेषण करके उन्हें विज्ञान और इंजीनियरिंग की दृष्टि से बेहतर समझना है। आलोचनात्मक सोच, व्यवस्थित प्रयोग और गहन विश्लेषण के ज़रिए हम उन प्रश्नों पर काम करते हैं जो हमें सबसे रोचक लगते हैं। ये हैं हमारे वर्तमान विषय।"}
