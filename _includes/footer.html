  <script>
    // Theme: light <-> dark (starts from the system setting). Language: English <-> Hindi.
    (function () {
      var d = document.documentElement;
      function isDark() {
        var t = d.getAttribute('data-theme');
        if (t) return t === 'dark';
        return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      [].forEach.call(document.querySelectorAll('.js-theme'), function (b) {
        b.addEventListener('click', function () {
          var next = isDark() ? 'light' : 'dark';
          d.setAttribute('data-theme', next); save('spin-theme', next);
        });
      });
      [].forEach.call(document.querySelectorAll('.js-lang'), function (b) {
        b.addEventListener('click', function () {
          var hi = d.getAttribute('data-lang') !== 'hi';
          if (hi) { d.setAttribute('data-lang', 'hi'); d.lang = 'hi'; }
          else { d.removeAttribute('data-lang'); d.lang = 'en'; }
          save('spin-lang', hi ? 'hi' : 'en');
        });
      });
    })();
  </script>
