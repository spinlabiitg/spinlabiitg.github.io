
<div class="news-box">
<h4>{% include t.html k="news" %}</h4>

{% for article in site.data.news limit:5 %}
<div class="news-item">
  <span class="news-date">{{ article.date | remove: '-' }}</span>
  {{ article.headline | markdownify }}
</div>
{% endfor %}

<a class="news-all" href="{{ site.url }}{{ site.baseurl }}/allnews.html">{% include t.html k="news_all" %}</a>

</div>
